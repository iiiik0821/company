<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端智农科技有限公司</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2d5016;
            --secondary-color: #4a7c29;
            --accent-color: #6c9b3d;
            --light-color: #f0f4ea;
            --dark-color: #1a2e0d;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
        }
        
        .navbar {
            background-color: var(--primary-color) !important;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }
        
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: color 0.3s;
        }
        
        .nav-link:hover {
            color: white !important;
        }
        
        .btn-primary {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .hero {
            background: linear-gradient(rgba(45, 80, 22, 0.8), rgba(45, 80, 22, 0.9)), url('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=drone%20flying%20over%20green%20farmland%20with%20modern%20agriculture%20technology&image_size=landscape_16_9');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
        }
        
        .section {
            padding: 80px 0;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .footer {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 0;
        }
        
        .feature-icon {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        
        .process-step {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .process-step.active {
            border-left: 5px solid var(--secondary-color);
        }
        
        @media (max-width: 768px) {
            .hero {
                padding: 60px 0;
            }
            
            .section {
                padding: 40px 0;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="bi bi-drone"></span> 云端智农
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/product">核心产品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/company">公司介绍</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/structure">公司架构</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/training">员工培训与招聘</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/support">产品售后与询问</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 内容区域 -->
    {% block content %}
    {% endblock %}

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h3>云端智农科技有限公司</h3>
                    <p>聚焦低空经济与现代农业，打造"感知-决策-作业"一体化智慧农业系统</p>
                </div>
                <div class="col-md-4">
                    <h4>联系我们</h4>
                    <p>电话：400-123-4567</p>
                    <p>邮箱：info@yunduanzhinong.com</p>
                    <p>地址：吉林省长春市吉林大学</p>
                </div>
                <div class="col-md-4">
                    <h4>快速链接</h4>
                    <ul class="list-unstyled">
                        <li><a href="/" class="text-light">首页</a></li>
                        <li><a href="/product" class="text-light">核心产品</a></li>
                        <li><a href="/company" class="text-light">公司介绍</a></li>
                        <li><a href="/support" class="text-light">联系我们</a></li>
                    </ul>
                </div>
            </div>
            <div class="mt-4 text-center">
                <p>&copy; 2026 云端智农科技有限公司 版权所有</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
